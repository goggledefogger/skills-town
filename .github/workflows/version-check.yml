name: Version check

# A skill's version string is its release. Fail the PR if a skill changed and its version did not.
on:
  pull_request:

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node scripts/check-versions.mjs "origin/${{ github.base_ref }}"
